# Settings template used by the Railway deployment (see /Dockerfile).
# Docs: https://docs.searxng.org/admin/settings/
use_default_settings: true

server:
  # Replaced at boot by entrypoint.sh, or overridden by $SEARXNG_SECRET.
  secret_key: "ultrasecretkey"
  image_proxy: true
  # Off: this instance is consumed as an API, not a public web UI.
  limiter: false
  public_instance: false

search:
  formats:
    - html
    - json

# Engines merge into the defaults by name. From this Railway datacentre IP the
# two default heavyweights (duckduckgo, startpage) answer with a CAPTCHA and
# SearXNG suspends them, which left only brave + google cse actually replying.
# These three are off by default and tolerate datacentre IPs, so the chain
# stands on more than two engines.
engines:
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  - name: bing
    disabled: false
