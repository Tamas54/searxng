# Settings template used by the Railway deployment (see /Dockerfile).
# Docs: https://docs.searxng.org/admin/settings/
use_default_settings: true

server:
  # Replaced at boot by entrypoint.sh, or overridden by $SEARXNG_SECRET.
  secret_key: "ultrasecretkey"
  image_proxy: true
  # Off: this instance is consumed as an API, not a public web UI.
  limiter: false
  public_instance: false

search:
  formats:
    - html
    - json

# Engines merge into the defaults by name. From this Railway datacentre IP the
# two default heavyweights (duckduckgo, startpage) answer with a CAPTCHA and
# SearXNG suspends them, which left only brave + google cse replying.
#
# bing is deliberately NOT here. It is off by default, and enabling it looked
# like a win on result COUNT (20 -> 42) while being a loss on quality: queried
# from this IP it ignores the query's language and returns unrelated pages
# (a Hungarian central-bank query returned a Russian game marketplace, then a
# soundboard site as the merged #1). Measured on three queries, dropping bing
# restores the correct top hit. Count is not quality — re-measure before
# re-enabling it.
engines:
  - name: qwant
    disabled: false
  - name: mojeek
    disabled: false
