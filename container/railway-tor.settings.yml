# Settings for the Railway deployment WITH the Tor exit pool (see /Dockerfile
# and container/railway-entrypoint.sh). The plain template (railway.settings.yml)
# is the fallback when Tor does not bootstrap: the same core without the pool.
#
# 2026-09-15 — egress and the engine core, measured for many users:
#  * DIRECT (the Railway IP): google cse, duckduckgo web, duckduckgo, brave,
#    qwant, luxxle. The image is SearXNG >= 2026.9.4 (curl_cffi, Chrome TLS
#    fingerprint): locally measured duckduckgo html 4/4, brave 4/4, qwant 3/4 —
#    with the old httpx image the Railway IP got duckduckgo html 48/48 "access
#    denied". Long suspensions here: retrying a blocked IP prolongs the block.
#  * NO Tor exit pool: measured under load (48 requests at 20/min) duckduckgo
#    through 12 isolated Tor circuits answered 3/48 and qwant 2/48 — both deny
#    Tor exits at sustained rates (a small 4-query sample had looked fine).
#    The most IP-tolerant engines at that load, from ONE residential IP:
#    duckduckgo web 48/48, bing news 48/48, duckduckgo (html) 45/48; google
#    cse, brave and qwant hit their per-IP limits within minutes.
#    `suspend_cap` (container/patch_suspend_cap.py) stays available per engine.
use_default_settings: true

server:
  # Replaced at boot by the entrypoint, or overridden by $SEARXNG_SECRET.
  secret_key: "ultrasecretkey"
  image_proxy: true
  # Off: this instance is consumed as an API, not a public web UI.
  limiter: false
  public_instance: false

search:
  formats: [html, json]
  default_lang: "auto"
  suspended_times:
    SearxEngineAccessDenied: 900
    SearxEngineCaptcha: 900
    SearxEngineTooManyRequests: 600
    cf_SearxEngineCaptcha: 3600
    cf_SearxEngineAccessDenied: 3600
    recaptcha_SearxEngineCaptcha: 3600

outgoing:
  # SearXNG answers when its slowest engine is done (or timed out).
  request_timeout: 3.5
  max_request_timeout: 5.0

engines:
  # ── DIRECT core (general + echo_web) ────────────────────────────────────
  - name: google cse
    disabled: false
    categories: [general, web, echo_web]
    timeout: 3.0
  - name: duckduckgo web
    disabled: false
    categories: [general, echo_web]
    timeout: 3.5
  - name: duckduckgo
    disabled: false
    categories: [general, web, echo_web]
    timeout: 3.5
  - name: brave
    disabled: false
    categories: [general, web, echo_web]
    timeout: 3.0
  - name: qwant
    disabled: false
    categories: [general, web, echo_web]
    timeout: 3.0
  # luxxle OFF (2026-09-15, production burst of 12 parallel searches): 2/12
  # answers, 4 access denied, the rest slow — and SearXNG answers only when its
  # SLOWEST engine is done, so luxxle's 3.5 s held every search at ~3.8 s.
  - name: luxxle
    disabled: true
  # yandex: EVERY edition, every level — Kommandant (2026-09-15): „minden
  # szinten is kellhet — gazdagítja a keresőmotort". (No SafeSearch support;
  # accepted.) echo_web_yx stays for the clients that still ask for it.
  - name: yandex
    disabled: false
    categories: [general, echo_web, echo_web_yx]
    timeout: 3.0
  # OFF: startpagina (parse errors with the current image), mojeek (a CAPTCHA
  # page with HTTP 200 = silent zero), bing (poisons the ranking). startpage is
  # inactive upstream (proof-of-work CAPTCHA, searxng PR #6669).
  - name: startpagina
    disabled: true
  - name: mojeek
    disabled: true
  # onion-only engines of the defaults: they cannot load without Tor and only
  # add an error line to every boot log
  - name: ahmia
    inactive: true   # not even loaded (disabled still loads)
  - name: torch
    inactive: true   # not even loaded (disabled still loads)

  # ── NEWS (echo_news; off the default path) ──────────────────────────────
  - name: bing news
    categories: [news, echo_news]
    timeout: 3.0
  - name: duckduckgo news
    disabled: true
  - name: qwant news
    disabled: false
    categories: [news, echo_news_qw]
    timeout: 3.0
